<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戒酒打卡 · SOBER DAYS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --amber: #ffb340;
    --amber2: #ff8a3d;
    --teal: #2dd4bf;
    --bg: #0d0a08;
    --panel: rgba(28, 20, 12, 0.88);
  }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: #f5e9d7;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 30px 16px 48px;
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(255,179,64,0.22), transparent 55%),
      radial-gradient(ellipse at 85% 110%, rgba(45,212,191,0.10), transparent 55%),
      radial-gradient(ellipse at 10% 100%, rgba(255,138,61,0.10), transparent 50%);
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .sysline { text-align: center; color: var(--amber); font-size: 12px; letter-spacing: 4px; opacity: .75; }
  h1 {
    text-align: center; font-size: 50px; font-weight: 800; letter-spacing: 8px; margin: 12px 0 4px; color: #fff7ea;
    text-shadow: 0 0 18px rgba(255,179,64,.55), 0 0 46px rgba(255,138,61,.35);
  }
  .subtitle { text-align: center; color: var(--teal); letter-spacing: 10px; font-size: 14px; }
  .tagline {
    text-align: center; margin: 18px auto 2px; font-size: 14px; color: #ffe1ae;
    border: 1px solid rgba(255,179,64,.4); background: rgba(255,179,64,.06);
    display: table; padding: 8px 16px; border-radius: 999px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid rgba(255,179,64,.35);
    border-radius: 20px;
    box-shadow: 0 18px 44px rgba(0,0,0,.5), inset 0 0 24px rgba(255,179,64,.04);
    padding: 20px; margin-top: 20px;
  }
  .panel h2 { font-size: 13px; letter-spacing: 4px; color: var(--amber); margin-bottom: 14px; }
  .panel h2::before { content: "◆ "; color: var(--teal); }

  .timer { text-align: center; padding: 6px 0 2px; }
  .timer .big {
    font-size: 44px; font-weight: 700; color: #fff; letter-spacing: 2px;
    text-shadow: 0 0 14px rgba(255,179,64,.65);
    font-variant-numeric: tabular-nums;
  }
  .timer .labels { display: flex; justify-content: center; gap: 26px; color: #c9a86a; font-size: 11px; letter-spacing: 4px; margin-top: 4px; }
  .timer .hint { margin-top: 10px; font-size: 12px; color: #a68d64; }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat { border: 1px solid rgba(45,212,191,.35); background: rgba(45,212,191,.05); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 700; color: var(--amber); text-shadow: 0 0 10px rgba(255,179,64,.5); font-variant-numeric: tabular-nums; }
  .stat .cap { font-size: 11px; color: #b8c9c4; letter-spacing: 2px; margin-top: 4px; }

  .milestone { margin-bottom: 12px; }
  .milestone .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .milestone .name { color: #f5e9d7; }
  .milestone .when { color: #c9a86a; font-size: 12px; }
  .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--amber), var(--teal)); box-shadow: 0 0 12px rgba(255,179,64,.6); transition: width .6s ease; }
  .milestone.done .name { color: var(--amber); }
  .milestone.done .name::after { content: " ✓ 已达成"; color: var(--teal); font-size: 11px; }

  label { display: block; font-size: 12px; letter-spacing: 2px; color: #c9a86a; margin: 12px 0 6px; }
  input {
    width: 100%; background: rgba(0,0,0,.45); border: 1px solid rgba(255,179,64,.35); color: #fff;
    padding: 10px 12px; font-size: 15px; font-family: inherit; outline: none; border-radius: 10px;
  }
  input:focus { border-color: var(--teal); box-shadow: 0 0 10px rgba(45,212,191,.4); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btns { display: flex; gap: 12px; margin-top: 18px; }
  button {
    flex: 1; cursor: pointer; padding: 13px; font-size: 16px; font-weight: 700; letter-spacing: 4px;
    font-family: inherit; border: none; border-radius: 12px; transition: transform .06s ease, filter .15s ease;
  }
  button:active { transform: scale(.97); }
  .start { background: linear-gradient(90deg, var(--amber2), var(--amber)); color: #231303; box-shadow: 0 0 20px rgba(255,179,64,.35); }
  .start:hover { filter: brightness(1.08); }
  .reset { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
  .footer { text-align: center; margin-top: 22px; font-size: 12px; color: #8a7350; letter-spacing: 2px; }
  .footer a { color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <div class="sysline">// DAY ONE — 从今天起，清醒过日子 //</div>
  <h1>戒酒打卡</h1>
  <div class="subtitle">SOBER DAYS</div>
  <div class="tagline">🍺 昨天的酒已经喝完，明天的酒不必再约</div>

  <div class="panel">
    <h2>清醒计时器</h2>
    <div class="timer">
      <div class="big" id="timer">00 : 00 : 00 : 00</div>
      <div class="labels"><span>天 DAYS</span><span>时 HRS</span><span>分 MIN</span><span>秒 SEC</span></div>
      <div class="hint" id="startHint">设置下面的开始时间，点「开始打卡」开始计时</div>
    </div>
  </div>

  <div class="panel">
    <h2>战绩统计</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="drinksAvoided">0</div><div class="cap">少喝的酒（杯）</div></div>
      <div class="stat"><div class="num" id="moneySaved">¥0</div><div class="cap">省下的钱</div></div>
      <div class="stat"><div class="num" id="mornings">0</div><div class="cap">清醒的早晨</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>身体修复进度</h2>
    <div id="milestones"></div>
  </div>

  <div class="panel">
    <h2>参数设置</h2>
    <label>开始戒酒的时间</label>
    <input type="datetime-local" id="startTime">
    <div class="grid2">
      <div>
        <label>以前每天喝几杯</label>
        <input type="number" id="perDay" min="1" max="100" value="3">
      </div>
      <div>
        <label>每杯均价（元）</label>
        <input type="number" id="price" min="1" max="2000" value="30">
      </div>
    </div>
    <div class="btns">
      <button class="start" id="startBtn">开始打卡</button>
      <button class="reset" id="resetBtn">重新开始</button>
    </div>
  </div>

  <div class="footer">想喝的时候回来看看这块屏幕 · <a href="https://cinhflaswes58.github.io/">← 去用计算器</a></div>
</div>

<script>
  const MILESTONES = [
    { mins: 24 * 60,    when: '24小时', name: '酒精基本代谢完，血糖趋于稳定' },
    { mins: 3 * 1440,   when: '3天',    name: '睡眠开始变深，不再靠酒精入睡' },
    { mins: 7 * 1440,   when: '1周',    name: '胃口和精力回升，清晨不再头疼' },
    { mins: 14 * 1440,  when: '2周',    name: '血压开始下降，胃黏膜逐步修复' },
    { mins: 30 * 1440,  when: '1个月',  name: '肝脏脂肪减少，皮肤状态变好' },
    { mins: 90 * 1440,  when: '3个月',  name: '专注力和记忆力明显提升' },
    { mins: 365 * 1440, when: '1年',    name: '心血管和肝脏风险显著下降' },
  ];

  const $ = id => document.getElementById(id);
  const milestonesEl = $('milestones');
  MILESTONES.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = 'milestone'; div.id = 'ms' + i;
    div.innerHTML = `<div class="row"><span class="name">${m.name}</span><span class="when">${m.when}</span></div><div class="bar"><div></div></div>`;
    milestonesEl.appendChild(div);
  });

  function loadSettings() {
    try { return JSON.parse(localStorage.getItem('soberDays') || 'null'); } catch { return null; }
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const s = loadSettings();
    if (!s || !s.start) {
      $('timer').textContent = '00 : 00 : 00 : 00';
      return;
    }
    const elapsedMs = Math.max(0, Date.now() - s.start);
    const elapsedMin = elapsedMs / 60000;
    const totalSec = Math.floor(elapsedMs / 1000);
    const d = Math.floor(totalSec / 86400);
    const h = Math.floor(totalSec % 86400 / 3600);
    const m = Math.floor(totalSec % 3600 / 60);
    const sec = totalSec % 60;
    $('timer').textContent = `${pad(d)} : ${pad(h)} : ${pad(m)} : ${pad(sec)}`;
    $('startHint').textContent = '清醒进行中 · 开始于 ' + new Date(s.start).toLocaleString('zh-CN');

    const drinks = elapsedMin / 1440 * s.perDay;
    $('drinksAvoided').textContent = Math.floor(drinks).toLocaleString();
    $('moneySaved').textContent = '¥' + (drinks * s.price).toFixed(2);
    $('mornings').textContent = Math.floor(elapsedMin / 1440).toLocaleString();

    MILESTONES.forEach((mm, i) => {
      const pct = Math.min(100, elapsedMin / mm.mins * 100);
      const el = document.getElementById('ms' + i);
      el.querySelector('.bar > div').style.width = pct + '%';
      el.classList.toggle('done', pct >= 100);
    });
  }

  const saved = loadSettings();
  if (saved) {
    $('perDay').value = saved.perDay;
    $('price').value = saved.price;
    const dt = new Date(saved.start);
    $('startTime').value = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  } else {
    const now = new Date();
    $('startTime').value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }

  $('startBtn').addEventListener('click', () => {
    const t = $('startTime').value ? new Date($('startTime').value).getTime() : Date.now();
    const perDay = Math.max(1, parseInt($('perDay').value) || 3);
    const price = Math.max(1, parseFloat($('price').value) || 30);
    localStorage.setItem('soberDays', JSON.stringify({ start: t, perDay, price }));
    tick();
  });
  $('resetBtn').addEventListener('click', () => {
    localStorage.removeItem('soberDays');
    $('drinksAvoided').textContent = '0';
    $('moneySaved').textContent = '¥0';
    $('mornings').textContent = '0';
    $('startHint').textContent = '设置下面的开始时间，点「开始打卡」开始计时';
    MILESTONES.forEach((mm, i) => {
      const el = document.getElementById('ms' + i);
      el.querySelector('.bar > div').style.width = '0%';
      el.classList.remove('done');
    });
    tick();
  });

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
